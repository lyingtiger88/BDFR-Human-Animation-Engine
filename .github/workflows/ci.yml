name: Engine CI

on:
  # Run the platform matrix after a substantial engine capability lands.
  push:
    branches: [main]
    paths:
      - 'engine/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - '.github/workflows/ci.yml'
      - 'migration/**'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            arch: x64
            generator: Visual Studio 17 2022
          - os: ubuntu-latest
            arch: x64
            generator: Unix Makefiles
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify migrated source snapshots
        run: python migration/verify_snapshot.py
      - name: Configure (Windows x64)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -G "${{ matrix.generator }}" -A x64 -DBDFR_BUILD_TESTS=ON
      - name: Configure (Linux x64)
        if: runner.os == 'Linux'
        run: cmake -S . -B build -G "${{ matrix.generator }}" -DCMAKE_BUILD_TYPE=Release -DBDFR_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Sign Windows engine binaries with BDFR self-signed test certificate
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=BDFR Test Publisher" -CertStoreLocation "Cert:\CurrentUser\My" -KeyAlgorithm RSA -KeyLength 3072 -HashAlgorithm SHA256 -NotAfter (Get-Date).AddYears(3)
          New-Item -ItemType Directory -Force artifacts/signing | Out-Null
          Export-Certificate -Cert $cert -FilePath artifacts/signing/BDFR-Test-Publisher.cer | Out-Null
          $sdk = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Filter signtool.exe -Recurse | Where-Object { $_.FullName -match "\\x64\\signtool.exe$" } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $sdk) { throw "Windows SDK SignTool not found" }
          $files = @(Get-ChildItem build -Filter *.exe -Recurse -File)
          if ($files.Count -eq 0) { throw "No Windows engine executables found in build output" }
          foreach ($file in $files) {
            & $sdk.FullName sign /fd SHA256 /sha1 $cert.Thumbprint $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "Signing failed: $($file.FullName)" }
            & $sdk.FullName verify /pa /v $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "Signature verification failed: $($file.FullName)" }
          }
          $files | ForEach-Object { Get-FileHash $_.FullName -Algorithm SHA256 } | ForEach-Object { "$($_.Hash) *$($_.Path)" } | Set-Content artifacts/signing/SHA256SUMS.txt
          Write-Host "Signed and verified $($files.Count) Windows engine executables using test-only identity."
      - name: Test (Windows multi-config)
        if: runner.os == 'Windows'
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Test (Linux single-config)
        if: runner.os == 'Linux'
        run: ctest --test-dir build --output-on-failure

      - name: Upload signed Windows engine test artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: BDFR-Human-Animation-Engine-Windows-SelfSigned-Test
          path: |
            build/**/*.exe
            artifacts/signing/*
          if-no-files-found: error
          retention-days: 30

  studio-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt and OpenCV development packages
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev libopencv-dev
      - name: Configure unified Qt Studio
        run: cmake -S . -B build-studio -DCMAKE_BUILD_TYPE=Release -DBDFR_BUILD_TESTS=OFF -DBDFR_ENABLE_OPENCV=ON -DBDFR_BUILD_UNIFIED_STUDIO=ON
      - name: Build unified Qt Studio
        run: cmake --build build-studio --config Release --parallel
