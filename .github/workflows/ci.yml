name: Engine CI

on:
  # Deliberately manual-only while the owner requested development without builds.
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            arch: x64
            generator: Visual Studio 17 2022
          - os: ubuntu-latest
            arch: x64
            generator: Unix Makefiles
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify migrated source snapshots
        run: python migration/verify_snapshot.py
      - name: Configure (Windows x64)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -G "${{ matrix.generator }}" -A x64 -DBDFR_BUILD_TESTS=ON
      - name: Configure (Linux x64)
        if: runner.os == 'Linux'
        run: cmake -S . -B build -G "${{ matrix.generator }}" -DCMAKE_BUILD_TYPE=Release -DBDFR_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test (Windows multi-config)
        if: runner.os == 'Windows'
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Test (Linux single-config)
        if: runner.os == 'Linux'
        run: ctest --test-dir build --output-on-failure
